*{box-sizing:border-box;margin:0;padding:0}
body{background:#080d08;color:#bfcfbf;font-family:'Noto Sans TC',sans-serif;font-size:14px}

.mono{font-family:'DM Mono',monospace}.up{color:#34d399}.dn{color:#f87171}.warn{color:#fbbf24}
.hdr{background:#0b120b;border-bottom:1px solid #182818;padding:10px 15px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.hdr-logo{font-size:15px;font-weight:700;color:#4dd87a;font-family:'DM Mono',monospace}

.tabs{display:flex;gap:1px;background:#0b120b;padding:4px 10px;border-bottom:1px solid #182818;overflow-x:auto;-webkit-overflow-scrolling:touch;position:sticky;top:52px;z-index:99}
.tab{padding:5px 11px;border-radius:4px;cursor:pointer;font-size:11px;color:#4a6a4a;border:none;background:none;white-space:nowrap;font-family:'Noto Sans TC',sans-serif}
.tab.on{color:#4dd87a;background:#132013;font-weight:500}
.tab:hover{color:#7a9a7a;background:#121f12}

.body{padding:12px 14px;max-width:960px;margin:0 auto}
.sec{font-size:10px;letter-spacing:.13em;color:#3a5a3a;text-transform:uppercase;margin-bottom:10px}
.card{background:#0b120b;border:1px solid #182818;border-radius:7px;padding:12px;margin-bottom:10px}

.rdanger{background:#1a0a0a;border:1px solid #451515}
.rwarn{background:#191300;border:1px solid #3a2a00}
.rinfo{background:#00101a;border:1px solid #003050}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

.dinfo{background:#60a5fa;box-shadow:0 0 5px #60a5fa}

.disc{margin-top:14px;padding:8px 11px;background:#0b120b;border:1px solid #182818;border-radius:5px;font-size:10px;color:#3a5a3a;line-height:1.9}
table{width:100%;border-collapse:collapse}
th{font-size:10px;color:#3a5a3a;text-align:left;padding:6px 8px;border-bottom:1px solid #182818}
td{padding:6px 8px;font-size:12px;border-bottom:1px solid #0e150e}

// ── 工具函式 ──────────────────────────────────────
var apiCache = {};
function apiFetch(path) {
  if (apiCache[path] && Date.now()-apiCache[path].t < 60000) return Promise.resolve(apiCache[path].d);
  return fetch(PROXY+path).then(function(r){return r.json();}).then(function(d){
    apiCache[path]={d:d,t:Date.now()}; return d;
  }).catch(function(){return null;});
}

function calcScore(code) {
  var s=STOCKS[code]; if(!s) return 50;
  if(s.sector==='ETF') return 72;
  var sc=50;
  if(s.roe>20)sc+=15; else if(s.roe>12)sc+=8; else if(s.roe<8)sc-=10;
  if(s.pe<15)sc+=10; else if(s.pe<25)sc+=5; else if(s.pe>35)sc-=10;
  if(s.gross_margin>50)sc+=10; else if(s.gross_margin>30)sc+=5;
  if(s.revenue_growth>20)sc+=10; else if(s.revenue_growth>5)sc+=5; else if(s.revenue_growth<0)sc-=8;
  if(s.debt_ratio<30)sc+=5; else if(s.debt_ratio>60)sc-=8;
  if(s.divYield>4)sc+=5;
  return Math.max(0,Math.min(100,sc));
}

function calcMA(closes,n) {
  return closes.map(function(_,i){
    if(i<n-1) return null;
    var sum=0; for(var j=i-n+1;j<=i;j++) sum+=closes[j];
    return +(sum/n).toFixed(1);
  });
}

var LS = {
  get:function(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};

function ScoreRing(props) {
  var sc=props.sc, size=props.size||50;
  var r=size*.38, circ=2*Math.PI*r, fill=(sc/100)*circ;
  var c=sc>=75?'#34d399':sc>=55?'#fbbf24':'#f87171';
  return h('svg',{width:size,height:size},
    h('circle',{cx:size/2,cy:size/2,r:r,fill:'none',stroke:'#1e2a1e',strokeWidth:size*.095}),
    h('circle',{cx:size/2,cy:size/2,r:r,fill:'none',stroke:c,strokeWidth:size*.095,
      strokeDasharray:fill+' '+circ,strokeLinecap:'round',
      transform:'rotate(-90 '+(size/2)+' '+(size/2)+')'}),
    h('text',{x:size/2,y:size/2+5,textAnchor:'middle',fill:c,
      style:{fontSize:size*.25,fontWeight:700,fontFamily:"'DM Mono',monospace"}},sc)
  );
}

function Light(props) {
  var color=props.color;
  var m={green:['#34d399','rgba(52,211,153,0.1)','良好'],yellow:['#fbbf24','rgba(251,191,36,0.1)','普通'],red:['#f87171','rgba(248,113,113,0.1)','注意'],gray:['#6a8a6a','rgba(100,130,100,0.08)','N/A']};
  var arr=m[color]||m.gray, c=arr[0], bg=arr[1], lbl=arr[2];
  return h('span',{style:{display:'inline-flex',alignItems:'center',gap:3,padding:'1px 6px',borderRadius:3,background:bg,fontSize:10}},
    h('span',{style:{width:6,height:6,borderRadius:'50%',background:c,boxShadow:'0 0 4px '+c,display:'inline-block'}}),
    h('span',{style:{color:c}},lbl)
  );
}

function Sparkline(props) {
  var code=props.code;
  var d=(CANDLES[code]||[]).map(function(c){return c[3];});
  if(!d.length) return null;
  var w=68,ht=24,min=Math.min.apply(null,d),max=Math.max.apply(null,d);
  var pts=d.map(function(v,i){return (i/(d.length-1))*w+','+(ht-((v-min)/(max-min||1))*ht);}).join(' ');
  var pos=d[d.length-1]>=d[0];
  return h('svg',{width:w,height:ht,style:{overflow:'visible'}},
    h('polyline',{points:pts,fill:'none',stroke:pos?'#34d399':'#f87171',strokeWidth:'1.5',strokeLinejoin:'round'})
  );
}

function CandleChart(props) {
  var code=props.code, candles=props.candles||CANDLES[code]||[];
  var W=520,H=175,VH=34,PL=42,PR=8,PT=7,PB=2;
  var cw=Math.max(4,Math.floor((W-PL-PR)/candles.length)-1);
  var closes=candles.map(function(c){return c[3];});
  var ma5=calcMA(closes,5), ma20=calcMA(closes,20);
  var ap=[]; candles.forEach(function(c){ap.push(c[1],c[2]);});
  var minP=Math.min.apply(null,ap), maxP=Math.max.apply(null,ap);
  var maxV=Math.max.apply(null,candles.map(function(c){return c[4];}));
  function py(v){return PT+((maxP-v)/(maxP-minP||1))*(H-PT-PB);}
  function px(i){return PL+i*((W-PL-PR)/candles.length)+(W-PL-PR)/candles.length/2;}
  var maLines=[];
  [[ma5,'#fbbf24'],[ma20,'#60a5fa']].forEach(function(pair){
    var arr=pair[0],col=pair[1];
    var pts=arr.map(function(v,i){return v!=null?(px(i)+','+py(v)):null;}).filter(function(x){return x!=null;});
    if(pts.length>1) maLines.push(h('polyline',{key:col,points:pts.join(' '),fill:'none',stroke:col,strokeWidth:'1',opacity:'.85'}));
  });
  var pricelines=[minP,(minP+maxP)/2,maxP].map(function(v){
    return h('g',{key:v},
      h('line',{x1:PL,x2:W-PR,y1:py(v),y2:py(v),stroke:'#1a2a1a',strokeWidth:'1'}),
      h('text',{x:PL-3,y:py(v)+4,textAnchor:'end',fill:'#3a5a3a',fontSize:'9'},+v.toFixed(0))
    );
  });
  var bars=candles.map(function(c,i){
    var o=c[0],hi2=c[1],lo=c[2],cl=c[3]; var up=cl>=o; var col=up?'#34d399':'#f87171';
    var bt=py(Math.max(o,cl)), bb=py(Math.min(o,cl));
    return h('g',{key:i},
      h('line',{x1:px(i),x2:px(i),y1:py(hi2),y2:py(lo),stroke:col,strokeWidth:'1'}),
      h('rect',{x:px(i)-cw/2,y:bt,width:cw,height:Math.max(1,bb-bt),fill:col,opacity:'.85'})
    );
  });
  var vols=candles.map(function(c,i){
    return h('rect',{key:'v'+i,x:px(i)-cw/2,y:H+4+VH*.1+(1-c[4]/maxV)*VH*.9,width:cw,
      height:Math.max(1,(c[4]/maxV)*VH*.9),fill:c[3]>=c[0]?'rgba(52,211,153,.35)':'rgba(248,113,113,.35)'});
  });
  return h('div',{style:{overflowX:'auto'}},
    h('svg',{width:W,height:H+VH+4,style:{display:'block',minWidth:W}},
      pricelines, bars, maLines,
      h('rect',{x:PL,y:2,width:6,height:3,fill:'#fbbf24'}),
      h('text',{x:PL+9,y:9,fill:'#fbbf24',fontSize:'9'},'MA5'),
      h('rect',{x:PL+36,y:2,width:6,height:3,fill:'#60a5fa'}),
      h('text',{x:PL+45,y:9,fill:'#60a5fa',fontSize:'9'},'MA20'),
      vols
    )
  );
}

    function genPrompt() {
      return '你是一位台灣的AI投資顧問，請根據以下客戶條件，以繁體中文提供個人化投資建議，分為五個部分：\n' +
        '【風險評估】【建議資產配置】【投資策略建議】【股息收入規劃】【注意事項】\n\n' +
        '客戶條件：\n' +
        '年齡：'+(advisor.age||'未填')+'歲\n' +
        '月收入：'+(advisor.income?advisor.income+'萬元':'未填')+'\n' +
        '可投資資產：'+(advisor.assets?advisor.assets+'萬元':'未填')+'\n' +
        '投資經驗：'+expOpts.find(function(x){return x.v===advisor.experience;}).l+'\n' +
        '風險承受度：'+riskOpts.find(function(x){return x.v===advisor.risk;}).l+'\n' +
        '投資目標：'+goalOpts.find(function(x){return x.v===advisor.goal;}).l+'\n\n' +
        '每個部分3-4句，給具體的台股/ETF建議方向（不要直接點名特定股票），' +
        '末尾加：⚠ 以上為AI輔助分析，不構成投資建議，投資有風險請自行判斷。';
    }

    function runAdvisor() {
      if(!advisor.age||!advisor.income||!advisor.assets){alert('請填寫年齡、收入、資產');return;}
      setAdvisorLoading(true);
      setAdvisorReport('');
      var prompt=genPrompt();
      fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':advisorApiKey,'anthropic-version':'2023-06-01'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1200,
          messages:[{role:'user',content:prompt}]})
      }).then(function(r){return r.json();}).then(function(d){
        if(d.content&&d.content[0]&&d.content[0].text) setAdvisorReport(d.content[0].text);
        else setAdvisorReport('⚠ 無法取得分析結果，請確認 API Key 是否正確。');
        setAdvisorLoading(false);
      }).catch(function(){
        setAdvisorReport('⚠ 連線失敗，請稍後再試。');
        setAdvisorLoading(false);
      });
    }

    return h('div',null,
      h('div',{className:'sec'},'AI 投資顧問'),
      h('div',{className:'card-v6',style:{marginBottom:10}},
        h('div',{style:{fontSize:12,color:'#818cf8',marginBottom:10,padding:'8px 12px',background:'#13132a',borderRadius:5,border:'1px solid #2d2d6b'}},
          '填寫個人條件，AI 依據你的情況產生專屬投資建議。所有建議僅供參考，不構成投資建議。'
        ),
        h('div',{className:'advisor-form'},
          h('div',null,
            h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:4}},'年齡'),
            h('input',{className:'inp',style:{width:'100%'},type:'number',placeholder:'例：35',
              value:advisor.age,onChange:function(e){setAdvisor(Object.assign({},advisor,{age:e.target.value}));}})
          ),
          h('div',null,
            h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:4}},'月收入（萬元）'),
            h('input',{className:'inp',style:{width:'100%'},type:'number',placeholder:'例：8',
              value:advisor.income,onChange:function(e){setAdvisor(Object.assign({},advisor,{income:e.target.value}));}})
          ),
          h('div',null,
            h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:4}},'可投資資產（萬元）'),
            h('input',{className:'inp',style:{width:'100%'},type:'number',placeholder:'例：200',
              value:advisor.assets,onChange:function(e){setAdvisor(Object.assign({},advisor,{assets:e.target.value}));}})
          ),
          h('div',null,
            h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:4}},'投資經驗'),
            h('select',{className:'inp',style:{width:'100%'},value:advisor.experience,
              onChange:function(e){setAdvisor(Object.assign({},advisor,{experience:e.target.value}));}},
              expOpts.map(function(o){return h('option',{key:o.v,value:o.v},o.l);})
            )
          ),
          h('div',null,
            h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:4}},'風險承受度'),
            h('select',{className:'inp',style:{width:'100%'},value:advisor.risk,
              onChange:function(e){setAdvisor(Object.assign({},advisor,{risk:e.target.value}));}},
              riskOpts.map(function(o){return h('option',{key:o.v,value:o.v},o.l);})
            )
          ),
          h('div',null,
            h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:4}},'投資目標'),
            h('select',{className:'inp',style:{width:'100%'},value:advisor.goal,
              onChange:function(e){setAdvisor(Object.assign({},advisor,{goal:e.target.value}));}},
              goalOpts.map(function(o){return h('option',{key:o.v,value:o.v},o.l);})
            )
          )
        ),
        h('div',{style:{marginTop:12,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}},
          h('div',null,
            h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:4}},'Anthropic API Key（選填，有才能使用 AI 功能）'),
            h('input',{className:'inp',style:{width:280},type:'password',placeholder:'sk-ant-...',
              value:advisorApiKey,onChange:function(e){setAdvisorApiKey(e.target.value);}})
          )
        ),
        h('button',{className:'btn bv6',style:{marginTop:12,fontSize:12},onClick:runAdvisor,disabled:advisorLoading},
          advisorLoading?'AI 分析中...':'產生 AI 投資建議'
        )
      ),
      advisorReport&&h('div',{className:'card-v6'},
        h('div',{className:'sec',style:{color:'#818cf8'}},'AI 投資建議報告'),
        h('div',{style:{fontSize:12,lineHeight:1.95,color:'#b0b0d0',whiteSpace:'pre-wrap'}},advisorReport),
        h('button',{className:'btn bgho',style:{marginTop:10,fontSize:11},onClick:function(){setAdvisorReport('');}},'清除報告')
      )
    );
  }

  // ═══ V6 財富中心 ═══════════════════════════════
  function renderWealth() {
    var totalAssets =
      (wealth.cash||0) +
      wealth.deposit.reduce(function(a,x){return a+(x.amount||0);},0) +
      wealth.saving.reduce(function(a,x){return a+(x.amount||0);},0) +
      wealth.insurance.reduce(function(a,x){return a+(x.amount||0);},0) +
      wealth.other.reduce(function(a,x){return a+(x.amount||0);},0) +
      pfS.reduce(function(a,b){return a+b.mv;},0);
    var totalDebt = wealth.debt||0;
    var netAssets = totalAssets - totalDebt;

    var categories = [
      {key:'stocks',label:'股票',color:'#34d399',amount:pfS.reduce(function(a,b){return a+b.mv;},0)},
      {key:'deposit',label:'定存',color:'#60a5fa',amount:wealth.deposit.reduce(function(a,x){return a+(x.amount||0);},0)},
      {key:'saving',label:'活存',color:'#fbbf24',amount:wealth.saving.reduce(function(a,x){return a+(x.amount||0);},0)},
      {key:'insurance',label:'保險',color:'#a78bfa',amount:wealth.insurance.reduce(function(a,x){return a+(x.amount||0);},0)},
      {key:'cash',label:'現金',color:'#2dd4bf',amount:wealth.cash||0},
      {key:'other',label:'其他',color:'#f87171',amount:wealth.other.reduce(function(a,x){return a+(x.amount||0);},0)},
    ].filter(function(x){return x.amount>0;});

    function updateField(category,field,value) {
      var w2 = Object.assign({},wealth);
      if(field==='cash') { w2.cash=+value; }
      else if(field==='debt') { w2.debt=+value; }
      else {
        w2[category] = wealth[category].map(function(x,i){
          if(i===0) return Object.assign({},x,{amount:+value});
          return x;
        });
      }
      setWealth(w2);
    }

    return h('div',null,
      h('div',{className:'sec'},'個人財富中心'),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:12}},
        [{l:'總資產',v:'$'+Math.round(totalAssets).toLocaleString(),c:'#bfcfbf'},
         {l:'總負債',v:'$'+Math.round(totalDebt).toLocaleString(),c:'#f87171'},
         {l:'淨資產',v:'$'+Math.round(netAssets).toLocaleString(),c:netAssets>=0?'#34d399':'#f87171'},
        ].map(function(x){return h('div',{key:x.l,className:'sumcard'},
          h('div',{className:'sumlbl'},x.l),
          h('div',{className:'sumval mono',style:{color:x.c}},x.v)
        );})
      ),
      totalAssets>0&&h('div',{className:'card-v6'},
        h('div',{className:'sec',style:{color:'#818cf8'}},'資產配置'),
        categories.map(function(cat){
          var pct=totalAssets>0?(cat.amount/totalAssets*100).toFixed(1):0;
          return h('div',{key:cat.key,style:{marginBottom:8}},
            h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:3}},
              h('span',{style:{color:'#b0b0d0'}},cat.label),
              h('span',{className:'mono',style:{color:cat.color}},'$'+Math.round(cat.amount).toLocaleString()+' ('+pct+'%)')
            ),
            h('div',{className:'progress-bar'},
              h('div',{className:'progress-fill',style:{width:pct+'%',background:cat.color}})
            )
          );
        })
      ),
      h('div',{className:'card-v6'},
        h('div',{className:'sec',style:{color:'#818cf8'}},'資產輸入'),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
          [{label:'定存（元）',field:'deposit',cat:'deposit'},
           {label:'活存（元）',field:'saving',cat:'saving'},
           {label:'保險（元）',field:'insurance',cat:'insurance'},
           {label:'現金（元）',field:'cash',cat:'cash'},
           {label:'其他資產（元）',field:'other',cat:'other'},
           {label:'總負債（元）',field:'debt',cat:'debt'},
          ].map(function(f){
            var val = f.field==='cash'?(wealth.cash||0):f.field==='debt'?(wealth.debt||0):(wealth[f.cat]&&wealth[f.cat][0]?wealth[f.cat][0].amount||0:0);
            return h('div',{key:f.field},
              h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:3}},f.label),
              h('input',{className:'inp',style:{width:'100%'},type:'number',placeholder:'0',value:val||'',
                onChange:function(e){updateField(f.cat,f.field,e.target.value);}})
            );
          })
        ),
        h('div',{style:{marginTop:10,fontSize:10,color:'#3a3a6a'}},'股票部分從投資組合自動計算')
      )
    );
  }

  // ═══ V6 策略工廠 ═══════════════════════════════
  function renderFactory() {
    var typeColor={income:'#fbbf24',growth:'#34d399',passive:'#60a5fa',value:'#a78bfa',momentum:'#f87171'};
    var typeLabel={income:'高股息',growth:'成長股',passive:'被動投資',value:'價值投資',momentum:'動能策略'};
    var statusColor={active:'#34d399',watch:'#fbbf24',retired:'#f87171'};
    var statusLabel={active:'啟用',watch:'觀察',retired:'淘汰'};
    var selFacObj=factories.find(function(f){return f.id===selFac;})||factories[0];

    function newFactory() {
      var id='f'+Date.now();
      var nf={id:id,name:'新策略',type:'growth',status:'active',version:1,
        conditions:{yield_min:0,pe_max:25,roe_min:10,rev_growth:5},
        created:new Date().toISOString().slice(0,7),modified:new Date().toISOString().slice(0,7),
        backtests:0,winRate:null,annReturn:null,maxDD:null,note:''};
      setFactories(factories.concat([nf]));
      setSelFac(id);
      setFacForm(Object.assign({},nf));
      setFacEdit(true);
    }

    function saveFactory() {
      setFactories(factories.map(function(f){
        if(f.id===facForm.id) return Object.assign({},facForm,{version:f.version+1,modified:new Date().toISOString().slice(0,7)});
        return f;
      }));
      setFacEdit(false);
    }

    function runFactoryBT(fac) {
      var r=runBT('0050',fac.type);
      if(r) {
        setFactories(factories.map(function(f){
          if(f.id===fac.id) return Object.assign({},f,{backtests:f.backtests+1,winRate:r.winRate,annReturn:r.ann,maxDD:r.maxDD});
          return f;
        }));
      }
    }

    return h('div',null,
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
        h('div',{className:'sec',style:{marginBottom:0}},'策略工廠'),
        h('button',{className:'btn bv6',style:{fontSize:11},onClick:newFactory},'+ 建立策略')
      ),
      h('div',{style:{display:'grid',gridTemplateColumns:'180px 1fr',gap:10}},
        h('div',null,
          factories.map(function(f){
            return h('div',{key:f.id,className:'fac-card'+(selFac===f.id?' active':''),
              onClick:function(){setSelFac(f.id);setFacEdit(false);}},
              h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}},
                h('div',{style:{fontSize:12,fontWeight:600,color:'#d0d0f0'}},f.name),
                h('span',{style:{fontSize:9,color:statusColor[f.status]||'#8a8aaa',background:'rgba(0,0,0,.3)',padding:'1px 5px',borderRadius:3}},statusLabel[f.status])
              ),
              h('div',{style:{marginTop:3,fontSize:10,color:typeColor[f.type]||'#8a8aaa'}},typeLabel[f.type]),
              h('div',{style:{fontSize:10,color:'#3a3a6a',marginTop:3}},'v'+f.version+' · '+f.created),
              f.annReturn!=null&&h('div',{style:{fontSize:10,color:f.annReturn>=0?'#34d399':'#f87171',marginTop:2}},'年化 '+(f.annReturn>0?'+':'')+f.annReturn+'%')
            );
          })
        ),
        selFacObj&&h('div',null,
          !facEdit&&h('div',null,
            h('div',{className:'card-v6'},
              h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:6}},
                h('div',null,
                  h('div',{style:{fontSize:15,fontWeight:700,color:'#d0d0f0'}},selFacObj.name),
                  h('div',{style:{marginTop:4,display:'flex',gap:6,flexWrap:'wrap'}},
                    h('span',{style:{fontSize:10,color:typeColor[selFacObj.type]||'#8a8aaa'}},typeLabel[selFacObj.type]),
                    h('span',{style:{fontSize:10,color:statusColor[selFacObj.status]||'#8a8aaa',background:'rgba(0,0,0,.3)',padding:'1px 6px',borderRadius:3}},statusLabel[selFacObj.status])
                  ),
                  h('div',{style:{fontSize:10,color:'#3a3a6a',marginTop:4}},'建立 '+selFacObj.created+' · v'+selFacObj.version+' · 回測 '+selFacObj.backtests+' 次')
                ),
                h('div',{style:{display:'flex',gap:5}},
                  h('button',{className:'btn bv6',style:{fontSize:11},onClick:function(){setFacForm(Object.assign({},selFacObj));setFacEdit(true);}},'編輯'),
                  h('button',{className:'btn bgho',style:{fontSize:11},onClick:function(){runFactoryBT(selFacObj);}},'回測'),
                  h('button',{className:'btn bdgr',style:{fontSize:11},onClick:function(){setFactories(factories.filter(function(f){return f.id!==selFacObj.id;}));}},'刪除')
                )
              ),
              h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:11}},
                h('div',null,
                  h('div',{style:{fontSize:10,color:'#3a3a6a',marginBottom:5}},'選股條件'),
                  Object.entries(selFacObj.conditions).map(function(entry){
                    var k=entry[0],v=entry[1];
                    var labels={yield_min:'殖利率>=',pe_max:'PE<=',roe_min:'ROE>=',rev_growth:'營收成長>='};
                    return h('div',{key:k,style:{fontSize:11,color:'#8080b0',padding:'2px 0'}},'• '+(labels[k]||k)+' '+v+(k==='pe_max'?'x':'%'));
                  })
                ),
                h('div',null,
                  h('div',{style:{fontSize:10,color:'#3a3a6a',marginBottom:5}},'回測績效'),
                  selFacObj.annReturn!=null?h('div',null,
                    [{l:'年化報酬',v:(selFacObj.annReturn>0?'+':'')+selFacObj.annReturn+'%',c:selFacObj.annReturn>=0?'#34d399':'#f87171'},
                     {l:'勝率',v:selFacObj.winRate+'%',c:'#fbbf24'},
                     {l:'最大回撤',v:'-'+selFacObj.maxDD+'%',c:'#f87171'},
                    ].map(function(x){return h('div',{key:x.l,style:{fontSize:11,color:'#8080b0',padding:'2px 0'}},x.l+': ',h('span',{style:{color:x.c,fontFamily:"'DM Mono',monospace"}},x.v));})
                  ):h('div',{style:{fontSize:11,color:'#3a3a6a'}},'尚未回測')
                )
              ),
              selFacObj.note&&h('div',{style:{marginTop:8,fontSize:11,color:'#5a5a8a',padding:'8px',background:'#13132a',borderRadius:4}},selFacObj.note)
            ),
            h('div',{className:'card-v6'},
              h('div',{className:'sec',style:{color:'#818cf8'}},'策略比較（所有策略 vs 定期定額）'),
              h('div',{style:{overflowX:'auto'}},
                h('table',null,
                  h('thead',null,h('tr',null,['策略名稱','類型','狀態','年化報酬','勝率','最大回撤','版本',''].map(function(t){return h('th',{key:t},t);}))),
                  h('tbody',null,factories.map(function(f){
                    return h('tr',{key:f.id,style:{background:f.id===selFac?'rgba(129,140,248,0.04)':''}},
                      h('td',{style:{fontWeight:500,color:'#d0d0f0'}},f.name),
                      h('td',null,h('span',{style:{fontSize:10,color:typeColor[f.type]||'#8a8aaa'}},typeLabel[f.type])),
                      h('td',null,h('span',{style:{fontSize:10,color:statusColor[f.status]||'#8a8aaa'}},statusLabel[f.status])),
                      h('td',{className:'mono',style:{color:f.annReturn!=null?(f.annReturn>=0?'#34d399':'#f87171'):'#3a3a6a'}},f.annReturn!=null?(f.annReturn>0?'+':'')+f.annReturn+'%':'—'),
                      h('td',{className:'mono warn'},f.winRate!=null?f.winRate+'%':'—'),
                      h('td',{className:'mono dn'},f.maxDD!=null?'-'+f.maxDD+'%':'—'),
                      h('td',{className:'mono',style:{color:'#3a3a6a'}},'v'+f.version),
                      h('td',null,
                        h('select',{className:'inp',style:{fontSize:10,padding:'2px 5px'},value:f.status,
                          onChange:function(e){var s=e.target.value;setFactories(factories.map(function(x){return x.id===f.id?Object.assign({},x,{status:s}):x;}));}},
                          [{v:'active',l:'啟用'},{v:'watch',l:'觀察'},{v:'retired',l:'淘汰'}].map(function(o){return h('option',{key:o.v,value:o.v},o.l);})
                        )
                      )
                    );
                  }))
                )
              )
            )
          ),
          facEdit&&facForm&&h('div',{className:'card-v6'},
            h('div',{style:{fontSize:13,fontWeight:600,color:'#818cf8',marginBottom:10}},'編輯策略'),
            h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}},
              h('div',null,
                h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:3}},'策略名稱'),
                h('input',{className:'inp',style:{width:'100%'},value:facForm.name,onChange:function(e){setFacForm(Object.assign({},facForm,{name:e.target.value}));}})
              ),
              h('div',null,
                h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:3}},'策略類型'),
                h('select',{className:'inp',style:{width:'100%'},value:facForm.type,onChange:function(e){setFacForm(Object.assign({},facForm,{type:e.target.value}));}},
                  [{v:'growth',l:'成長股'},{v:'income',l:'高股息'},{v:'passive',l:'被動投資'},{v:'value',l:'價值投資'},{v:'momentum',l:'動能策略'}].map(function(o){return h('option',{key:o.v,value:o.v},o.l);})
                )
              )
            ),
            h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:8}},
              [{label:'ROE 最低（%）',key:'roe_min'},{label:'PE 最高（x）',key:'pe_max'},
               {label:'殖利率最低（%）',key:'yield_min'},{label:'營收成長（%）',key:'rev_growth'}].map(function(f){
                return h('div',{key:f.key},
                  h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:3}},f.label),
                  h('input',{className:'inp',style:{width:'100%'},type:'number',value:facForm.conditions[f.key]||0,
                    onChange:function(e){setFacForm(Object.assign({},facForm,{conditions:Object.assign({},facForm.conditions,{[f.key]:+e.target.value})}));}})
                );
              })
            ),
            h('div',{style:{marginBottom:8}},
              h('div',{style:{fontSize:10,color:'#5a5a8a',marginBottom:3}},'策略備註'),
              h('textarea',{className:'note',style:{minHeight:50},value:facForm.note||'',onChange:function(e){setFacForm(Object.assign({},facForm,{note:e.target.value}));}})
            ),
            h('div',{style:{display:'flex',gap:7}},
              h('button',{className:'btn bv6',onClick:saveFactory},'儲存'),
              h('button',{className:'btn bgho',onClick:function(){setFacEdit(false);}},'取消')
            )
          )
        )
      )
    );
  }

  var content;
  if(tab==='watchlist') content=renderWatchlist();
  else if(tab==='detail') content=renderDetail();
  else if(tab==='compare') content=renderCompare();
  else if(tab==='backtest') content=renderBacktest();
  else if(tab==='filter') content=renderFilter();
  else if(tab==='portfolio') content=renderPortfolio();
  else if(tab==='etf') content=renderETF();
  else if(tab==='risk') content=renderRisk();
  else if(tab==='advisor') content=renderAdvisor();
  else if(tab==='wealth') content=renderWealth();
  else if(tab==='factory') content=renderFactory();
  else content=h('div',{className:'empty'},'功能開發中...');

  return h('div',{style:{minHeight:'100vh',background:'#080d08'}},
    h('div',{className:'hdr'},
      h('div',{style:{flex:1}},
        h('div',{className:'hdr-logo'},'台股分析儀 V5'),
        h('div',{className:'hdr-sub'},'V6 AI 財富管理平台 · 不構成投資建議')
      ),
      h('div',{style:{display:'flex',gap:5}},
        h('input',{className:'inp',style:{width:80},placeholder:searching?'搜尋中...':'代號/名稱',value:sv,
          onChange:function(e){setSv(e.target.value);},
          onKeyDown:function(e){if(e.key==='Enter')handleSearch();}}),
        h('button',{className:'btn bpri',style:{fontSize:11},onClick:handleSearch},'查')
      )
    ),
    h('div',{className:'tabs'},
      TABS.map(function(t){
        return h('button',{key:t.id,className:'tab'+(tab===t.id?' on':''),onClick:function(){setTab(t.id);}},
          t.label,
          t.n?h('span',{className:'tbadge'},t.n):null,
          t.v6?h('span',{className:'v6b'},'V6'):null
        );
      })
    ),
    h('div',{className:'body'},
      content,
      h('div',{className:'disc'},'本工具為個人研究輔助，所有資料僅供參考，不構成投資建議。股票資料來自 FinMind，可能有延遲。')
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
} // end initApp
</script>
</body>
</html>
